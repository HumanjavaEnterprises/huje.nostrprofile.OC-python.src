[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nostr-profile"
version = "0.1.9"
description = "Nostr profile management for OpenClaw AI agents — publish, read, and update kind 0 metadata"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Humanjava Enterprises", email = "dev@humanjava.com" },
]
keywords = [
    "nostr",
    "profile",
    "metadata",
    "openclaw",
    "ai",
    "identity",
    "nip-01",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "nostrkey>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://huje.tools"
Repository = "https://github.com/HumanjavaEnterprises/huje.nostrprofile.OC-python.src"
Documentation = "https://huje.tools"

[tool.hatch.build.targets.wheel]
packages = ["src/nostr_profile"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
